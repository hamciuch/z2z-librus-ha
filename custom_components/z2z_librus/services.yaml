reply_message:
  fields:
    content:
      required: true
      example: "Dziękuję, będziemy na zebraniu."
      selector:
        text:
          multiline: true
    message_id:
      required: false
      example: "1234567"
      selector:
        text:
    title:
      required: false
      selector:
        text:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: z2z_librus

send_message:
  fields:
    recipient:
      required: true
      example: "Jan Nowak"
      selector:
        text:
    title:
      required: true
      selector:
        text:
    content:
      required: true
      selector:
        text:
          multiline: true
    config_entry:
      required: false
      selector:
        config_entry:
          integration: z2z_librus
